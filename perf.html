 <div class="card"><h2>${curL}營收達成</h2><div class="s">預估＝已實現＋剩餘預估｜元</div><div class="t"><table><tr><th>公司</th><th>已實現</th><th>${curL}預估</th><th>AP</th><th>達成率</th><th>10月實績</th></tr>

 <div class="card"><h2>${curL} 稅後損益預估</h2><div class="s">預估營收 × 近${D.plmonths.length}月毛利率（${D.plmonths.map(x=>+x.slice(5)+'月').join('、')}）− 平均營業費用 ＋ 平均業外淨額，稅後＝稅前×${(1-0.2).toFixed(1)}｜元</div><div class="t"><table><tr><th></th><th>預估營收</th><th>毛利率</th><th>毛利</th><th>費用</th><th>業外</th><th>稅前</th><th>稅後</th><th>AP 稅後</th></tr>${['暐固','暐恩'].map(c=>{const p=D.pl_est[c];return `<tr><td>${c}</td><td>${M(p.rev)}</td><td>${(p.gm*100).toFixed(2)}%</td><td>${M(p.gp)}</td><td>${M(p.ex)}</td><td>${M(p.nonop)}</td><td>${M(p.pre)}</td><td><b>${M(p.post)}</b></td><td>${M(D.pcomp[c][cur].AP)}</td></tr>`}).join('')}</table></div></div>
 <div class="card"><h2>預估準確度追蹤</h2><div class="s">每天更新時記錄當時的 ${curL}預估；月底用 Cognos 實績驗證｜元</div>${(D.track||[]).map(t=>{const f=t.final,pm=x=>(x>0?'+':'')+(x*100).toFixed(1)+'%';return `<div class="s"><b>${+t.month.slice(5)}月</b>${f?'｜最終實績 '+M(f['暐固']+f['暐恩']):'｜月底後顯示誤差'}</div><div class="t"><table><tr><th>資料日</th><th>暐固預估</th><th>暐恩預估</th><th>合併預估</th><th>已實現</th>${f?'<th>誤差</th>':''}</tr>${t.pts.map(p=>{const s=p.gu+p.en;return `<tr><td>${p.asof.slice(5).replace('-','/')}</td><td>${M(p.gu)}</td><td>${M(p.en)}</td><td><b>${M(s)}</b></td><td>${M(p.gu_r+p.en_r)}</td>${f?`<td>${pm(s/(f['暐固']+f['暐恩'])-1)}</td>`:''}</tr>`}).join('')}</table></div>`}).join('')}</div>

 if(name==='暐恩'&&D.weekly['暐恩']&&D.weekly['暐恩'].length) h+=`<div class="card"><h2>週 Fcst 達成（暐恩 WIIN）</h2><div class="s">W${D.W}｜台數｜目標＝WIIN PSI TS Fcst｜實際＝Cognos 銷貨淨量（含 AirPods）</div><div class="t">${wkTable(D.weekly['暐恩'],true)}</div></div>`;
 if(name==='暐恩'&&D.credit&&Object.keys(D.credit).length) h+=`<div class="card"><h2>出貨額度檢查</h2><div class="s">含稅額度：酷澎 4 億、蝦皮 5 億｜每批上限＝近5週出貨÷10｜元（未稅）</div><div class="t"><table><tr><th>通路</th><th>待出分貨</th><th>每批上限</th>${D.credit['蝦皮'].batches.map(b=>`<th>${b.date.slice(5).replace('-','/')}</th>`).join('')}<th>${curL}可出</th><th>遞延12月</th></tr>${Object.entries(D.credit).map(([ch,c])=>`<tr><td>${ch}</td><td>${M(c.pending)}</td><td>${M(c.cap)}</td>${c.batches.map(b=>`<td>${M(b.amt)}<span class="d">額度 ${M(b.room)}</span></td>`).join('')}<td><b>${M(c.shipped)}</b></td><td>${M(c.deferred)}</td></tr>`).join('')}</table></div></div>`;

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockPL(){const pw=document.getElementById('plpw').value,msg=document.getElementById('plmsg');msg.textContent='';
 try{const raw=b64(D.pl_enc),salt=raw.slice(8,16),ct=raw.slice(16),enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
  Object.assign(D,JSON.parse(new TextDecoder().decode(pt)));
  document.getElementById('p-gm').innerHTML=gm();document.getElementById('p-sum').innerHTML=summary();
 }catch(e){msg.textContent='密碼錯誤'}}
function gm(){if(D.profit)return gm0();return `<div class="card" style="max-width:360px;margin:40px auto;text-align:center"><h2>損益預估</h2><div class="s">此頁需要密碼</div><input id="plpw" type="password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')unlockPL()" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;margin:6px 0 10px"><button onclick="unlockPL()" style="width:100%;border:0;background:var(--b);color:#fff;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer">解鎖</button><div id="plmsg" class="s" style="color:#d70015;margin:8px 0 0"></div></div>`}
const panes=[{id:'sum',tab:'匯總',html:summary()},{id:'gu',tab:'暐固',html:co('暐固')},{id:'mono',tab:'Mono',html:sg('Mono')},{id:'itls',tab:'ITLS',html:sg('ITLS')},{id:'en',tab:'暐恩',html:co('暐恩')},...(D.pl_enc?[{id:'gm',tab:'損益預估',html:gm()}]:[])];

(function(){ // 資料日期檢查：應為「今天之前最近的營業日」（週一對應上週五，因 Cognos 週末不更新）
  var tp=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Taipei'})), e=new Date(tp.getFullYear(),tp.getMonth(),tp.getDate()-1);
  while(e.getDay()==0||e.getDay()==6) e.setDate(e.getDate()-1);
  var s=e.getFullYear()+'-'+String(e.getMonth()+1).padStart(2,'0')+'-'+String(e.getDate()).padStart(2,'0');
  if(D.end<s){var m=document.getElementById('meta'), hm=tp.getHours()*60+tp.getMinutes();
    if(hm<11*60+15) m.innerHTML='<span style="color:#b25e00;font-weight:600">⏳ 待更新：資料目前到 '+D.end+'，今天預計 10:05 前後更新（最晚 11:15）</span>';
    else m.innerHTML='<span style="color:#d70015;font-weight:600">⚠ 更新失敗：資料只到 '+D.end+'（應為 '+s+'）</span>';}
})();
