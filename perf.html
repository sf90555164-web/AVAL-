const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockPL(){const pw=document.getElementById('plpw').value,msg=document.getElementById('plmsg');msg.textContent='';
 try{const raw=b64(D.pl_enc),salt=raw.slice(8,16),ct=raw.slice(16),enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,384));
  const key=await crypto.subtle.importKey('raw',bits.slice(0,32),'AES-CBC',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)},key,ct);
  Object.assign(D,JSON.parse(new TextDecoder().decode(pt)));
  document.getElementById('p-gm').innerHTML=gm();document.getElementById('p-sum').innerHTML=summary();
 }catch(e){msg.textContent='密碼錯誤'}}
function gm(){if(D.profit)return gm0();return `<div class="card" style="max-width:360px;margin:40px auto;text-align:center"><h2>損益預估</h2><div class="s">此頁需要密碼</div><input id="plpw" type="password" placeholder="輸入密碼" onkeydown="if(event.key==='Enter')unlockPL()" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;margin:6px 0 10px"><button onclick="unlockPL()" style="width:100%;border:0;background:var(--b);color:#fff;border-radius:10px;padding:10px;font:inherit;font-weight:600;cursor:pointer">解鎖</button><div id="plmsg" class="s" style="color:#d70015;margin:8px 0 0"></div></div>`}
