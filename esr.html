<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESR 到貨查詢 — AVAL & WIIN</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f7; color: #1d1d1f; font-size: 13px; }

  .sticky-top { position: sticky; top: 0; z-index: 100; background: #fff; }

  .header {
    background: #1d1d1f; color: #fff;
    padding: 7px 18px;
    display: flex; align-items: center; gap: 12px;
  }
  .header-logo { font-size: 18px; }
  .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .header-sub { color: #86868b; font-size: 11px; }
  .update-time { margin-left: auto; font-size: 11px; color: #86868b; white-space: nowrap; }

  .tab-bar {
    background: #fff; border-bottom: 1px solid #d2d2d7;
    padding: 0 18px; display: flex;
  }
  .tab-btn {
    padding: 8px 22px;
    font-size: 13px; font-weight: 500;
    border: none; background: none; cursor: pointer;
    color: #86868b; border-bottom: 2px solid transparent; transition: all .15s;
  }
  .tab-btn:hover { color: #1d1d1f; }
  .tab-btn.active { color: #0071e3; border-bottom-color: #0071e3; }
  .tab-btn .cnt { font-size: 10px; background: #f0f0f5; color: #86868b; border-radius: 9px; padding: 1px 6px; margin-left: 5px; }
  .tab-btn.active .cnt { background: #0071e3; color: #fff; }

  .controls {
    background: #fff; padding: 9px 18px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    border-bottom: 1px solid #d2d2d7;
  }
  .fl { display: flex; align-items: center; gap: 6px; }
  .fl-label { font-size: 13px; color: #86868b; white-space: nowrap; }
  select, input[type=text] {
    border: 1px solid #d2d2d7; border-radius: 8px; padding: 6px 10px;
    font-size: 13px; color: #1d1d1f; background: #fff; outline: none;
    transition: border-color .15s;
  }
  select:focus, input[type=text]:focus { border-color: #0071e3; }
  select { min-width: 130px; cursor: pointer; }
  input[type=text] { min-width: 180px; }

  .toggle-btn {
    display: flex; align-items: center; gap: 6px; padding: 6px 13px;
    border: 1px solid #d2d2d7; border-radius: 8px; background: #fff;
    cursor: pointer; font-size: 13px; color: #1d1d1f; transition: all .15s; white-space: nowrap;
  }
  .toggle-btn.active { background: #0071e3; color: #fff; border-color: #0071e3; }
  .toggle-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; opacity: .6; }

  .match-badge { font-size: 12px; color: #86868b; margin-left: auto; white-space: nowrap; }
  .match-badge b { color: #0071e3; }

  .scroll-area {
    height: calc(100vh - 108px);
    overflow-y: auto; overflow-x: auto;
  }

  .table-wrap { padding: 12px 18px 4px; }
  .table-shell { border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.10); }
  table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; }

  thead th:first-child { border-top-left-radius: 10px; }
  thead th:last-child  { border-top-right-radius: 10px; }
  tfoot td:first-child { border-bottom-left-radius: 10px; }
  tfoot td:last-child  { border-bottom-right-radius: 10px; }

  thead th {
    position: sticky; top: 0; z-index: 10;
    background: #f0f0f5;
    padding: 9px 11px; text-align: left;
    font-size: 11px; font-weight: 600; color: #6e6e73;
    white-space: nowrap; border-bottom: 1px solid #d2d2d7;
    cursor: pointer; user-select: none; line-height: 1.3;
  }
  thead th:hover { color: #1d1d1f; }
  thead th.sorted-asc::after  { content: ' ↑'; color: #0071e3; }
  thead th.sorted-desc::after { content: ' ↓'; color: #0071e3; }

  td { padding: 8px 11px; border-bottom: 1px solid #f5f5f7; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #f9f9fb !important; }

  tfoot td {
    position: sticky; bottom: 0; z-index: 10;
    background: #1d1d1f; color: #fff;
    padding: 8px 11px; font-size: 12px; font-weight: 700;
    border-top: 2px solid #0071e3; white-space: nowrap;
  }
  tfoot .num-pos    { color: #4cd964; }
  tfoot .num-backlog{ color: #ff6b6b; }
  tfoot .num-zero   { color: #636366; }
  tfoot .lbl        { color: #ababab; font-weight: 400; font-size: 11px; }

  tr.has-incoming td { background: #f0f7ff; }
  tr.has-incoming:hover td { background: #e5f0fd !important; }

  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .num-pos    { color: #1a8917; font-weight: 600; }
  .num-zero   { color: #c7c7cc; }
  .num-backlog{ color: #ff3b30; font-weight: 600; }

  .lob-tag { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .mpn-code { font-family: "SF Mono", Menlo, monospace; font-size: 11px; color: #6e6e73; }

  .lob-Mac,.lob-CPU       { background:#e8f4fd;color:#0071e3; }
  .lob-iPhone,.lob-IPHONE { background:#fde8f0;color:#c0336b; }
  .lob-iPad,.lob-IPAD     { background:#e8fde8;color:#1a8917; }
  .lob-AirPods,.lob-MUS_ACC { background:#fdf5e8;color:#d4600a; }
  .lob-Watch,.lob-WATCH   { background:#f0e8fd;color:#7300c4; }
  .lob-Accessories,.lob-DISPLAYS { background:#e8f7fd;color:#007aaa; }
  .lob-Home               { background:#fde8e8;color:#c00; }
  .lob-Services           { background:#f5f5f7;color:#6e6e73; }

  .pagination {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 18px; background: #fff; border-top: 1px solid #eee;
  }
  .page-info { font-size: 11px; color: #86868b; }
  .page-btns { display: flex; gap: 3px; }
  .pg { padding: 4px 9px; border: 1px solid #d2d2d7; border-radius: 5px; background: #fff; cursor: pointer; font-size: 11px; }
  .pg:hover { background: #f5f5f7; }
  .pg.active { background: #0071e3; color: #fff; border-color: #0071e3; }
  .pg:disabled { opacity: .4; cursor: not-allowed; }

  .empty { text-align: center; padding: 50px; color: #86868b; }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="sticky-top">
  <div class="header">
    <div class="header-logo">📦</div>
    <div>
      <div class="header-title">ESR 到貨查詢</div>
      <div class="header-sub">AVAL &amp; WIIN — 未來預計到貨數量</div>
    </div>
    <div class="update-time">資料更新：2026-07-20</div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchCompany('aval',this)">
      AVAL <span class="cnt" id="aval-cnt">175</span>
    </button>
    <button class="tab-btn" onclick="switchCompany('wiin',this)">
      WIIN <span class="cnt" id="wiin-cnt">1174</span>
    </button>
  </div>

  <div class="controls">
    <div class="fl"><span class="fl-label">LOB</span>
      <select id="lob-filter" onchange="onLobChange()"><option value="">全部</option></select>
    </div>
    <div class="fl"><span class="fl-label">SUB LOB</span>
      <select id="sublob-filter" onchange="applyFilters()"><option value="">全部</option></select>
    </div>
    <div class="fl"><span class="fl-label">搜尋</span>
      <input type="text" id="search-input" placeholder="品號 / 品名…" oninput="applyFilters()">
    </div>
    <button class="toggle-btn" id="future-toggle" onclick="toggleFuture()">
      <span class="dot"></span> 僅顯示有到貨
    </button>
    <div class="match-badge">符合：<b id="match-count">—</b> 筆</div>
  </div>
</div>

<div class="scroll-area">
  <div class="table-wrap">
    <div class="table-shell">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('lob')">LOB</th>
          <th onclick="sortBy('sub_lob')">SUB LOB</th>
          <th onclick="sortBy('mpn')">品號</th>
          <th onclick="sortBy('mpn_name')">品名</th>
          <th onclick="sortBy('sni')" class="num">本週到貨<br><span id="cw-range" style="font-weight:400;color:#a0a0aa"></span></th>
          <th onclick="sortBy('cw_plan')" class="num">下週到貨<br><span id="cw1-range" style="font-weight:400;color:#a0a0aa"></span></th>
          <th onclick="sortBy('cw1_plan')" class="num">下下週到貨<br><span id="cw2-range" style="font-weight:400;color:#a0a0aa"></span></th>
          <th onclick="sortBy('cw2_plan')" class="num">下下下週到貨<br><span id="cw3-range" style="font-weight:400;color:#a0a0aa"></span></th>
          <th onclick="sortBy('open_backlog')" class="num">未交單</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
      <tfoot>
        <tr>
          <td colspan="4"><span class="lbl">合計（篩選結果）</span></td>
          <td class="num" id="ft-sni">—</td>
          <td class="num" id="ft-cw">—</td>
          <td class="num" id="ft-cw1">—</td>
          <td class="num" id="ft-cw2">—</td>
          <td class="num" id="ft-backlog">—</td>
        </tr>
      </tfoot>
    </table>
    </div>
    <div id="empty-state" class="empty" style="display:none;">
      <div class="empty-icon">🔍</div>
      <h3>找不到符合條件的資料</h3>
      <p>請調整篩選條件後重試</p>
    </div>
  </div>

  <div class="pagination">
    <div class="page-info" id="page-info">—</div>
    <div class="page-btns" id="page-btns"></div>
  </div>
</div>

const PAGE_SIZE = 50;
let company = 'aval', raw = AVAL_DATA, filtered = [], sortKey = '', sortAsc = true, showFuture = false, page = 1;

function switchCompany(c, btn) {
  company = c; raw = c === 'aval' ? AVAL_DATA : WIIN_DATA;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
  sortKey = ''; sortAsc = true; page = 1;
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted-asc','sorted-desc'));
  buildLobs(); applyFilters();
}

function buildLobs() {
  const ls = document.getElementById('lob-filter'), ss = document.getElementById('sublob-filter');
  const lobs = [...new Set(raw.map(r => r.lob))].filter(Boolean).sort();
  ls.innerHTML = '<option value="">全部</option>' + lobs.map(l => `<option>${l}</option>`).join('');
  ss.innerHTML = '<option value="">全部</option>';
}

function onLobChange() {
  const lob = document.getElementById('lob-filter').value;
  const ss = document.getElementById('sublob-filter');
  const subs = [...new Set(raw.filter(r => !lob || r.lob === lob).map(r => r.sub_lob))].filter(Boolean).sort();
  ss.innerHTML = '<option value="">全部</option>' + subs.map(s => `<option>${s}</option>`).join('');
  page = 1; applyFilters();
}

function toggleFuture() {
  showFuture = !showFuture;
  document.getElementById('future-toggle').classList.toggle('active', showFuture);
  page = 1; applyFilters();
}

function applyFilters() {
  const lob = document.getElementById('lob-filter').value;
  const sub = document.getElementById('sublob-filter').value;
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  let d = raw.filter(r => {
    if (lob && r.lob !== lob) return false;
    if (sub && r.sub_lob !== sub) return false;
    if (q && !r.mpn.toLowerCase().includes(q) && !r.mpn_name.toLowerCase().includes(q)) return false;
    if (showFuture && r.sni===0 && r.cw_plan===0 && r.cw1_plan===0 && r.cw2_plan===0) return false;
    return true;
  });
  if (sortKey) d = [...d].sort((a,b) => {
    const va=a[sortKey], vb=b[sortKey];
    return typeof va==='number' ? (sortAsc?va-vb:vb-va) : (sortAsc?String(va).localeCompare(String(vb)):String(vb).localeCompare(String(va)));
  });
  filtered = d;
  updateBadge(); updateTfoot(); renderPage();
}

function updateBadge() {
  document.getElementById('match-count').textContent = filtered.length.toLocaleString();
  document.getElementById('aval-cnt').textContent = company==='aval' ? filtered.length : AVAL_DATA.length;
  document.getElementById('wiin-cnt').textContent = company==='wiin' ? filtered.length : WIIN_DATA.length;
}

function fmt(n) { return n > 0 ? n.toLocaleString() : '—'; }

function updateTfoot() {
  const sum = k => filtered.reduce((s,r)=>s+r[k],0);
  const s=sum('sni'), cw=sum('cw_plan'), cw1=sum('cw1_plan'), cw2=sum('cw2_plan'), bl=sum('open_backlog');
  document.getElementById('ft-sni').innerHTML    = `<span class="${s>0?'num-pos':'num-zero'}">${fmt(s)}</span>`;
  document.getElementById('ft-cw').innerHTML     = `<span class="${cw>0?'num-pos':'num-zero'}">${fmt(cw)}</span>`;
  document.getElementById('ft-cw1').innerHTML    = `<span class="${cw1>0?'num-pos':'num-zero'}">${fmt(cw1)}</span>`;
  document.getElementById('ft-cw2').innerHTML    = `<span class="${cw2>0?'num-pos':'num-zero'}">${fmt(cw2)}</span>`;
  document.getElementById('ft-backlog').innerHTML= `<span class="${bl>0?'num-backlog':'num-zero'}">${fmt(bl)}</span>`;
}

function renderPage() {
  const start=(page-1)*PAGE_SIZE, slice=filtered.slice(start,start+PAGE_SIZE);
  const tbody=document.getElementById('table-body'), empty=document.getElementById('empty-state');
  if (!filtered.length) { tbody.innerHTML=''; empty.style.display=''; return; }
  empty.style.display='none';
  tbody.innerHTML = slice.map(r => {
    const hi = r.sni>0||r.cw_plan>0||r.cw1_plan>0||r.cw2_plan>0;
    const lc = 'lob-'+r.lob.replace(/[^a-zA-Z]/g,'');
    return `<tr class="${hi?'has-incoming':''}">
      <td><span class="lob-tag ${lc}">${r.lob}</span></td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.sub_lob}">${r.sub_lob}</td>
      <td><span class="mpn-code">${r.mpn}</span></td>
      <td style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${r.mpn_name}">${r.mpn_name}</td>
      <td class="num ${r.sni>0?'num-pos':'num-zero'}">${fmt(r.sni)}</td>
      <td class="num ${r.cw_plan>0?'num-pos':'num-zero'}">${fmt(r.cw_plan)}</td>
      <td class="num ${r.cw1_plan>0?'num-pos':'num-zero'}">${fmt(r.cw1_plan)}</td>
      <td class="num ${r.cw2_plan>0?'num-pos':'num-zero'}">${fmt(r.cw2_plan)}</td>
      <td class="num ${r.open_backlog>0?'num-backlog':'num-zero'}">${fmt(r.open_backlog)}</td>
    </tr>`;
  }).join('');
  renderPager();
}

function renderPager() {
  const total=filtered.length, pages=Math.ceil(total/PAGE_SIZE), s=(page-1)*PAGE_SIZE+1, e=Math.min(page*PAGE_SIZE,total);
  document.getElementById('page-info').textContent = total ? `${s}–${e} / 共 ${total} 筆` : '無資料';
  const c=document.getElementById('page-btns');
  if (pages<=1) { c.innerHTML=''; return; }
  let h=`<button class="pg" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  for (let p=1;p<=pages;p++) {
    if (p===1||p===pages||(p>=page-2&&p<=page+2)) h+=`<button class="pg ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`;
    else if (p===page-3||p===page+3) h+=`<span style="padding:4px 3px;color:#86868b">…</span>`;
  }
  h+=`<button class="pg" onclick="goPage(${page+1})" ${page===pages?'disabled':''}>›</button>`;
  c.innerHTML=h;
}

function goPage(p) {
  const pages=Math.ceil(filtered.length/PAGE_SIZE);
  if (p<1||p>pages) return; page=p; renderPage();
  document.querySelector('.scroll-area').scrollTop=0;
}

function sortBy(k) {
  document.querySelectorAll('thead th').forEach(th=>th.classList.remove('sorted-asc','sorted-desc'));
  const idx={'lob':0,'sub_lob':1,'mpn':2,'mpn_name':3,'sni':4,'cw_plan':5,'cw1_plan':6,'cw2_plan':7,'open_backlog':8};
  const th=document.querySelectorAll('thead th')[idx[k]];
  if (sortKey===k) { sortAsc=!sortAsc; } else { sortKey=k; sortAsc=!(typeof raw[0]?.[k]==='number'); }
  th.classList.add(sortAsc?'sorted-asc':'sorted-desc');
  page=1; applyFilters();
}

buildLobs(); applyFilters();
</script>
<script>
  // 動態計算四週到貨日期範圍（每週日～週六）
  function getWeekRange(offsetWeeks) {
    const today = new Date();
    const day = today.getDay(); // 0=Sun, 1=Mon...
    // 本週起點 = 最近的週日
    const weekStart = new Date(today);
    weekStart.setDate(today.getDate() - day + offsetWeeks * 7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const fmt = d => (d.getMonth()+1) + '/' + d.getDate();
    return '(' + fmt(weekStart) + '–' + fmt(weekEnd) + ')';
  }
  function updateWeekHeaders() {
    const ids = ['cw-range','cw1-range','cw2-range','cw3-range'];
    ids.forEach((id, i) => {
      const el = document.getElementById(id);
      if (el) el.textContent = getWeekRange(i);
    });
  }
  document.addEventListener('DOMContentLoaded', updateWeekHeaders);
</script>
